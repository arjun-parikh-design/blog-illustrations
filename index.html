<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Postman Blog Illustrations</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --orange:    #FF6C37;
    --surface:   #212121;
    --surface-2: #1A1A1A;
    --surface-3: #1E1E1E;
    --border:    #2A2A2A;
  }
  html, body {
    margin: 0; padding: 0;
    height: 100%;
    overflow: hidden;
  }
  body { background: var(--surface); font-family: 'Inter', sans-serif; height: 100%; }

  .ciu-canvas-wrap {
    position: relative;
    height: 100%;
    border-radius: 0px;
    overflow: hidden;
    border: 1px solid var(--border);
    box-shadow: 0 0 0 1px rgba(255,255,255,0.04) inset;
    background: var(--surface-2);
    cursor: none;
    user-select: none;
    touch-action: none;
  }
  .ciu-canvas-wrap:active { cursor: none; }

  /* Custom cursor — dot + drag label */
  /* Custom cursor — Drag pill, fixed to viewport so it tracks mouse during scroll */
  .ciu-cursor {
    position: fixed;
    pointer-events: none;
    z-index: 50;
    top: 0; left: 0;
    display: flex; align-items: center;
    background: rgba(0,0,0,0.78);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-radius: 100px;
    padding: 8px 20px;
    font-size: 11px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: #fff;
    font-family: 'Inter', sans-serif;
    white-space: nowrap;
    opacity: 0;
    transition: opacity 0.2s ease;
    transform: translate3d(-50%, -50%, 0);
    will-change: transform;
    isolation: isolate;
  }
  .ciu-cursor.visible { opacity: 1; }

  /* Static base border */
  .ciu-cursor::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 100px;
    padding: 1.25px;
    background: #FF6C37;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    z-index: 1;
  }
  /* Animated glow sweep */
  .ciu-cursor::before {
    content: '';
    position: absolute; inset: 0;
    border-radius: 100px;
    padding: 1.25px;
    background: conic-gradient(
      from var(--glow-angle),
      transparent 0%, transparent 30%,
      rgba(255,215,199,0.5) 40%, #FFD7C7 46%,
      #ffffff 50%,
      #FFD7C7 54%, rgba(255,215,199,0.5) 60%,
      transparent 70%, transparent 100%
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: glow-spin 3s linear infinite;
    animation-fill-mode: none;
    pointer-events: none;
    z-index: 2;
    will-change: transform;
    transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }
  .ciu-canvas-wrap::after {
    content: '';
    position: absolute; inset: 0;
    border-radius: 0px;
    box-shadow: inset 0 0 80px rgba(0,0,0,0.4);
    pointer-events: none;
    z-index: 10;
  }
  .ciu-canvas-inner {
    position: absolute; top: 0; left: 0;
    width: 23520px;
    height: 2676px;
    will-change: transform;
  }
  .ciu-row {
    position: absolute; top: 0; left: 0;
    width: 23520px;
    height: 2676px;
  }
  .ciu-canvas-card {
    position: absolute;
    width: 360px; height: 191px;
    border-radius: 7px; overflow: hidden;
    border: 1.5px solid var(--border);
    background: var(--surface-3);
    background-size: cover;
    background-position: center;
    transition: transform 0.22s ease-out;
    will-change: transform;
  }
  .no-card-transition .ciu-canvas-card { transition: none; }
  /* ── Glow button (drag hint) ── */
  @property --glow-angle {
    syntax: '<angle>';
    initial-value: 0deg;
    inherits: false;
  }
  @keyframes glow-spin {
    to { --glow-angle: 360deg; }
  }

  /* Firefox fallback: @property unsupported → conic-gradient with var won't animate.
     Provide a static visible glow border so the effect degrades gracefully. */
  @supports not (background: paint(something)) {
    @-moz-document url-prefix() {
      .ciu-cursor::before,
      .ciu-drag-hint::before {
        background: conic-gradient(
          #FFD7C7, #ffffff, #FFD7C7, rgba(255,215,199,0.3), #FFD7C7
        );
        animation: none;
      }
    }
  }

  .ciu-drag-hint {
    position: absolute;
    bottom: 50%;
    left: 50%;
    transform: translateX(-50%) translateY(50%);
    z-index: 30;
    display: inline-flex; align-items: center; justify-content: center;
    padding: 16px 36px;
    border-radius: 100px;
    border: none;
    background: rgba(0,0,0,0.78);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    pointer-events: none;
    transition: opacity 0.5s;
    gap: 8px;
    white-space: nowrap;
    isolation: isolate;
  }
  .ciu-drag-hint { display: none !important; }
  .ciu-cursor { display: none; }
  @media (min-width: 769px) {
    .ciu-cursor { display: flex; }
  }

  /* Static base border */
  .ciu-drag-hint::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 100px;
    padding: 1.5px;
    background: #FF6C37;
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    pointer-events: none;
    z-index: 1;
  }

  /* Animated glow sweep */
  .ciu-drag-hint::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 100px;
    padding: 1.5px;
    background: conic-gradient(
      from var(--glow-angle),
      transparent 0%,
      transparent 30%,
      rgba(255, 215, 199, 0.5) 40%,
      #FFD7C7 46%,
      #ffffff 50%,
      #FFD7C7 54%,
      rgba(255, 215, 199, 0.5) 60%,
      transparent 70%,
      transparent 100%
    );
    -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
    -webkit-mask-composite: xor;
    mask-composite: exclude;
    animation: glow-spin 3s linear infinite;
    animation-fill-mode: none;
    pointer-events: none;
    z-index: 2;
    will-change: transform;
    transform: translateZ(0);
    backface-visibility: hidden;
    -webkit-backface-visibility: hidden;
  }

  .ciu-drag-hint-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: #FF6C37;
    flex-shrink: 0;
    animation: ciu-dot-pulse 1.8s ease-in-out infinite;
    position: relative; z-index: 3;
  }
  @keyframes ciu-dot-pulse {
    0%,100% { opacity: 1; transform: scale(1); }
    50%      { opacity: 0.3; transform: scale(0.6); }
  }
  .ciu-drag-hint-text {
    font-size: 13px; font-weight: 500;
    letter-spacing: 0.08em; text-transform: uppercase;
    color: #ffffff;
    font-family: 'Inter', sans-serif;
    position: relative; z-index: 3;
  }
  /* ── Responsive breakpoints ───────────────────────────── */
  @media (max-width: 768px) {
    .ciu-canvas-wrap { border-radius: 0px; }
    .ciu-canvas-wrap::after { border-radius: 0px; }
  }
  @media (max-width: 480px) {
    .ciu-canvas-wrap { border-radius: 0px; }
    .ciu-canvas-wrap::after { border-radius: 0px; }
  }


</style>
</head>

<script>
(function() {
  // ── YOUR IMAGES GO HERE ────────────────────────────────
  // Replace the empty strings with your image filenames.
  // Each card's data-img attribute references one of these by index.
  var CIU_IMGS = [
    "img_01.jpg", // 0  — row 1
    "img_02.jpg", // 1
    "img_03.jpg", // 2
    "img_04.jpg", // 3
    "img_05.jpg", // 4
    "img_06.jpg", // 5
    "img_07.jpg", // 6
    "img_08.jpg", // 7
    "img_09.jpg", // 8
    "img_10.jpg", // 9
    "img_11.jpg", // 10
    "img_12.jpg", // 11
    "img_13.jpg", // 12 — row 2
    "img_14.jpg", // 13
    "img_15.jpg", // 14
    "img_16.jpg", // 15
    "img_17.jpg", // 16
    "img_18.jpg", // 17
    "img_19.jpg", // 18
    "img_20.jpg", // 19
    "img_21.jpg", // 20
    "img_22.jpg", // 21
    "img_23.jpg", // 22
    "img_24.jpg", // 23
    "img_25.jpg", // 24 — row 3
    "img_26.jpg", // 25
    "img_27.jpg", // 26
    "img_28.jpg", // 27
    "img_29.jpg", // 28
    "img_30.jpg", // 29
    "img_31.jpg", // 30
    "img_32.jpg", // 31
    "img_33.jpg", // 32
    "img_34.jpg", // 33
    "img_35.jpg", // 34
    "img_36.jpg", // 35
    "img_37.jpg", // 36 — row 4
    "img_38.jpg", // 37
    "img_39.jpg", // 38
    "img_40.jpg", // 39
    "img_41.jpg", // 40
    "img_42.jpg", // 41
    "img_43.jpg", // 42
    "img_44.jpg", // 43
    "img_45.jpg", // 44
    "img_46.jpg", // 45
    "img_47.jpg", // 46
    "img_48.jpg"  // 47 — moved to end of row 4
  ];

  var win   = document.getElementById('ciuCanvasWrap');
  var inner = document.getElementById('ciuCanvasInner');
  var hint   = document.getElementById('ciuDragHint');
  var cursor = document.getElementById('ciuCursor');
  if (!win || !inner) return;

  // Custom cursor tracking — fixed to viewport, positioned via transform (scroll-proof)
  var isScrolling = false;
  var cursorScale = 1;
  function placeCursor(cx, cy) {
    cursor.style.transform = 'translate3d(' + (cx) + 'px,' + (cy) + 'px, 0) translate(-50%, -50%) scale(' + cursorScale + ')';
  }
  win.addEventListener('mouseenter', function() {
    if (cursor && !isScrolling) cursor.classList.add('visible');
  });
  win.addEventListener('mouseleave', function() {
    if (cursor) cursor.classList.remove('visible');
  });
  win.addEventListener('mousemove', function(e) {
    if (!cursor) return;
    if (!isScrolling && !cursor.classList.contains('visible')) {
      cursor.classList.add('visible');
    }
    placeCursor(e.clientX, e.clientY);
  });

  // Preload all images to prevent browser unloading off-screen backgrounds.
  // onerror flags any image that fails so its cards can fall back to surface color.
  var _failed = {};
  var _preloadCache = CIU_IMGS.map(function(src, i) {
    var img = new Image();
    img.onerror = function() {
      _failed[i] = true;
      inner.querySelectorAll('.ciu-canvas-card[data-img="' + i + '"]').forEach(function(c) {
        c.style.backgroundImage = '';
      });
    };
    img.src = src;
    return img;
  });

  inner.querySelectorAll('.ciu-canvas-card').forEach(function(card) {
    var idx = parseInt(card.getAttribute('data-img'), 10);
    if (!isNaN(idx) && CIU_IMGS[idx] && !_failed[idx]) {
      card.style.backgroundImage = 'url(' + CIU_IMGS[idx] + ')';
    }
  });

  var TILE_W = 4704;
  var TILE_H = 892;

  function computeScale() {
    var w = window.innerWidth;
    return w <= 480 ? 0.55 : w <= 768 ? 0.72 : 1;
  }
  var SCALE = computeScale();
  var x = Math.max(-TILE_W * SCALE + 100, -1800), y = -100;
  var vx = 0, vy = 0;
  var isDrag = false;
  var lastMouseX, lastMouseY, lastTime;
  var raf = null;
  var hasInteracted = false;

  var FRICTION       = 0.92;
  var _tiltFn        = null; // filled in by tilt module below
  var BLUR_THRESHOLD = 14;
  var BLUR_MAX       = 3;
  var BLUR_SPEED_MAX = 40;

  function wrapVal(v, size) {
    while (v < -size) v += size;
    while (v > 0)     v -= size;
    return v;
  }

  function wrap() {
    x = wrapVal(x, TILE_W * SCALE);
    y = wrapVal(y, TILE_H * SCALE);
  }

  function setBlur(speed) {
    if (speed <= BLUR_THRESHOLD) {
      inner.style.filter = ''; return;
    }
    var t = Math.min(1, (speed - BLUR_THRESHOLD) / (BLUR_SPEED_MAX - BLUR_THRESHOLD));
    inner.style.filter = 'blur(' + (t * BLUR_MAX).toFixed(1) + 'px)';
  }


  function render() {
    var t = 'translate(' + x.toFixed(1) + 'px,' + y.toFixed(1) + 'px)';
    inner.style.transform = SCALE < 1 ? t + ' scale(' + SCALE + ')' : t;
    inner.style.transformOrigin = '0 0';
  }

  function loop() {
    vx *= FRICTION; vy *= FRICTION;
    x += vx; y += vy;
    wrap();
    var speed = Math.sqrt(vx * vx + vy * vy);
    setBlur(speed);
    render();
    if (_tiltFn) _tiltFn();
    if (speed > 0.15) { raf = requestAnimationFrame(loop); }
    else { vx = 0; vy = 0; inner.style.filter = ''; raf = null; }
  }

  function startLoop() { if (!raf) raf = requestAnimationFrame(loop); }

  function onDown(px, py) {
    if (raf) { cancelAnimationFrame(raf); raf = null; }
    vx = 0; vy = 0;
    inner.style.filter = '';
    isDrag = true;
    hasInteracted = true;
    if (hint) hint.classList.add('hidden');
    lastMouseX = px; lastMouseY = py;
    lastTime = performance.now();
    if (cursor) { cursorScale = 0.92; placeCursor(px, py); }
  }

  function onMove(px, py) {
    if (!isDrag) return;
    if (!hasInteracted) {
      hasInteracted = true;
      if (hint) hint.classList.add('hidden');
    }
    var now = performance.now();
    var dt  = now - lastTime;
    var dx  = px - lastMouseX;
    var dy  = py - lastMouseY;
    x += dx; y += dy;
    wrap(); render();
    if (dt > 0) {
      vx = vx * 0.6 + (dx / dt * 16) * 0.4;
      vy = vy * 0.6 + (dy / dt * 16) * 0.4;
    }
    var speed = Math.sqrt(dx*dx + dy*dy) / Math.max(dt, 1) * 16;
    setBlur(speed);
    lastMouseX = px; lastMouseY = py; lastTime = now;
  }

  function onUp() {
    if (!isDrag) return;
    isDrag = false;
    if (cursor) { cursorScale = 1; placeCursor(lastMouseX, lastMouseY); }
    startLoop();
  }

  // Idle drift — loops indefinitely until the user drags
  var driftAngle = 0;
  function drift() {
    if (hasInteracted) return;
    driftAngle += 0.012;
    x -= 0.7;
    y -= 0.15 + Math.sin(driftAngle) * 0.2;
    wrap(); render();
    if (_tiltFn) _tiltFn();
    requestAnimationFrame(drift);
  }
  setTimeout(function() { if (!hasInteracted) requestAnimationFrame(drift); }, 400);

  win.addEventListener('mousedown', function(e) {
    if (e.button !== 0) return; // left button only — ignore right/middle click
    onDown(e.clientX, e.clientY); e.preventDefault();
  });
  window.addEventListener('mousemove', function(e) { onMove(e.clientX, e.clientY); });
  window.addEventListener('mouseup', onUp);
  win.addEventListener('touchstart', function(e) {
    if (e.touches.length > 1) { isDrag = false; return; } // ignore multi-touch (pinch/zoom)
    onDown(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive: true });
  win.addEventListener('touchmove',  function(e) {
    if (e.touches.length > 1) { isDrag = false; return; } // bail on pinch
    onMove(e.touches[0].clientX, e.touches[0].clientY); e.preventDefault();
  }, { passive: false });
  win.addEventListener('touchend', onUp);
  win.addEventListener('touchcancel', onUp);

  // Hide cursor while page is scrolling
  var scrollTimer;
  window.addEventListener('scroll', function() {
    isScrolling = true;
    if (cursor) cursor.classList.remove('visible');
    clearTimeout(scrollTimer);
    scrollTimer = setTimeout(function() { isScrolling = false; }, 200);
  }, { passive: true });

  // Recompute scale + cached rect on resize / orientation change
  var resizeTimer;
  function recompute() {
    SCALE = computeScale();
    x = wrapVal(x, TILE_W * SCALE);
    y = wrapVal(y, TILE_H * SCALE);
    render();
  }
  window.addEventListener('resize', function() {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(recompute, 150);
  }, { passive: true });
  // Re-run after full load — inside an iframe, innerWidth can be stale on first paint
  window.addEventListener('load', recompute);

  render();

  // ── Magnetic hover tilt ────────────────────────────────
  // Cards near the cursor tilt toward it in 3D. Desktop only.
  (function() {
    if (window.matchMedia('(pointer: coarse)').matches) return; // skip touch devices

    var CARD_W    = 360;   // actual rendered card width
    var CARD_H    = 191;   // actual rendered card height
    var TILT_MAX  = 16;    // max degrees of rotation
    var RADIUS    = 420;   // px influence zone

    // Cache static card positions once — they never change
    var cardData = Array.from(inner.querySelectorAll('.ciu-canvas-card')).map(function(card) {
      return {
        el: card,
        cl: parseFloat(card.style.left) + CARD_W / 2,
        ct: parseFloat(card.style.top)  + CARD_H / 2,
        tilted: false
      };
    });

    var curX = -9999, curY = -9999, ticking = false;

    function applyTilt() {
      ticking = false;
      if (isDrag) return;

      var wRect = win.getBoundingClientRect();
      var relX  = curX - wRect.left;
      var relY  = curY - wRect.top;
      var wW    = wRect.width;
      var wH    = wRect.height;

      for (var i = 0; i < cardData.length; i++) {
        var cd  = cardData[i];
        // Card center in win-relative screen space
        var scX = cd.cl * SCALE + x;
        var scY = cd.ct * SCALE + y;

        // Skip cards clearly off-screen
        if (scX < -RADIUS || scX > wW + RADIUS ||
            scY < -RADIUS || scY > wH + RADIUS) {
          if (cd.tilted) { cd.el.style.transform = ''; cd.tilted = false; }
          continue;
        }

        var dx   = relX - scX;
        var dy   = relY - scY;
        var dist = Math.sqrt(dx * dx + dy * dy);

        if (dist < RADIUS && dist > 1) {
          var str  = 1 - dist / RADIUS;
          str = str * str; // quadratic falloff — snappier near cursor
          var rY   =  (dx / (CARD_W * SCALE * 0.5)) * TILT_MAX * str;
          var rX   = -(dy / (CARD_H * SCALE * 0.5)) * TILT_MAX * str;
          cd.el.style.transform = 'perspective(500px) rotateX(' + rX.toFixed(2) + 'deg) rotateY(' + rY.toFixed(2) + 'deg)';
          cd.tilted = true;
        } else if (cd.tilted) {
          cd.el.style.transform = '';
          cd.tilted = false;
        }
      }
    }

    // Expose to outer scope so loop() and drift() can call it
    _tiltFn = applyTilt;

    win.addEventListener('mousemove', function(e) {
      curX = e.clientX; curY = e.clientY;
      if (!ticking) { ticking = true; requestAnimationFrame(applyTilt); }
    });

    win.addEventListener('mouseleave', function() {
      curX = -9999; curY = -9999;
      for (var i = 0; i < cardData.length; i++) {
        var cd = cardData[i];
        if (cd.tilted) { cd.el.style.transform = ''; cd.tilted = false; }
      }
    });

    // Single class toggle — much cheaper than looping 300 cards
    win.addEventListener('mousedown', function() {
      inner.classList.add('no-card-transition');
    });
    window.addEventListener('mouseup', function() {
      setTimeout(function() { inner.classList.remove('no-card-transition'); }, 50);
    });
  })();

})();
